function inferBankName(fileName){var n=String(fileName||'导入词汇').replace(/\.[^.]+$/,'');if(/小学/.test(n))return '小学词汇';if(/初中/.test(n))return '初中词汇';if(/高中/.test(n))return '高中词汇';if(/考研/.test(n))return '考研词汇';if(/四级|CET4/i.test(n))return '四级词汇';if(/六级|CET6/i.test(n))return '六级词汇';if(/雅思|IELTS/i.test(n))return '雅思词汇';if(/托福|TOEFL/i.test(n))return '托福词汇';return n+'词汇';}

function parseWordListText(txt,fileName){txt=String(txt||'').replace(/^\uFEFF/,'');var name=inferBankName(fileName);var trimmed=txt.trim();var rows=[];if(!trimmed)return [];try{var obj=JSON.parse(trimmed);var arr=Array.isArray(obj)?obj:(obj.words||obj.data||[]);return cleanBankWords(arr,name);}catch(e){}var lines=trimmed.split(/\r?\n/).filter(function(l){return l.trim()&&!/^\s*#/.test(l);});if(!lines.length)return [];var first=parseCSVLine(lines[0]);var lower=first.map(function(x){return x.toLowerCase();});var hasHeader=lower.some(function(x){return ['word','单词','英文'].indexOf(x)>=0;});var header=hasHeader?first:null;var start=hasHeader?1:0;for(var i=start;i<lines.length;i++){var cols=parseCSVLine(lines[i]);if(cols.length<2){cols=lines[i].trim().split(/\s+/);if(cols.length>=2)cols=[cols[0],cols.slice(1).join(' ')];}

function importWordBank(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var words=parseWordListText(r.result,f.name);if(!words.length)throw new Error('未识别到单词。请使用 CSV/TXT/JSON，至少包含 word 和 meaning。');var def=inferBankName(f.name);var name=prompt('请输入本词库名称：',def)||def;name=String(name).trim()||def;if(name==='考研词汇'&&!confirm('“考研词汇”为内置词库名称，是否仍要覆盖为导入词库？'))return;if(wordBanks[name]&&!confirm('已存在词库“'+name+'”，是否覆盖？'))return;wordBanks[name]=words;storeWordBanks();currentBankName=name;localStorage.setItem(BANK_SELECT_KEY,currentBankName);SOURCE=wordBanks[currentBankName];state=buildState(null);save();toast('已导入 '+name+'：'+words.length+' 个单词');init();}catch(err){toast('导入失败：'+err.message);}finally{e.target.value='';}};r.readAsText(f,'utf-8');}

function giveLetterHint(id){var w=state.words.find(function(x){return x.id===id;}),h=currentHint;if(!w||!h)return;var idx=-1;for(var i=0;i<w.word.length;i++){if(!h.revealed[i]&&w.word[i]!=='-'){idx=i;break;}}if(idx>=0){h.revealed[idx]=true;h.hints++;updateHintMask(id);}else toast('所有字母都已提示');}
function giveRandomHint(id){var w=state.words.find(function(x){return x.id===id;}),h=currentHint;if(!w||!h)return;var arr=[];for(var i=0;i<w.word.length;i++){if(w.word[i]!=='-'&&!h.revealed[i])arr.push(i);}if(arr.length){var idx=arr[Math.floor(Math.random()*arr.length)];h.revealed[idx]=true;h.hints++;updateHintMask(id);}else toast('所有字母都已提示');}
function showFullAnswer(id){var w=state.words.find(function(x){return x.id===id;}),h=currentHint;if(!w||!h)return;h.revealed=h.revealed.map(function(){return true;});h.hints+=2;updateHintMask(id);document.getElementById('hintRes').innerHTML='<p style="color:var(--bad)">答案：<b>'+escapeHtml(w.word)+'</b>｜'+escapeHtml(w.meaning)+'</p>';wrong(w);log('提示拼写',1);}
function checkHintSpell(id){var w=state.words.find(function(x){return x.id===id;}),inp=document.getElementById('hintInput'),h=currentHint;if(!w||!inp)return;var ok=norm(inp.value)===norm(w.word);var score=Math.max(2,8-Math.min(6,(h&&h.hints?h.hints:0)*2));document.getElementById('hintRes').innerHTML=ok?'<p style="color:var(--ok)">正确！得分 +'+score+'：<b>'+escapeHtml(w.word)+'</b>｜'+escapeHtml(w.meaning)+'</p>':'<p style="color:var(--bad)">不正确。正确答案：<b>'+escapeHtml(w.word)+'</b>｜'+escapeHtml(w.meaning)+'</p>';if(ok){correct(w);markMastered(w);}else{wrong(w);}log('提示拼写',ok?score:1);save();if(!ok)inp.focus();}
function makeQuiz(){var w=pick();if(!w)return null;return {w:w,opts:shuffle([w].concat(distractors(w,3))),done:false};}
function choice(){quiz=makeQuiz();if(!quiz){donePanel();return;}setHtml('<div class="panel"><h2>✅ 选择闯关</h2><div class="word" style="font-size:42px">'+escapeHtml(quiz.w.word)+'</div><div class="phon">'+escapeHtml(quiz.w.phonetic)+'</div><div class="row"><button type="button" class="secondary" onclick="speakCurrentChoice()">🔊 朗读单词</button></div><div class="space"></div>'+quiz.opts.map(function(o){return '<button class="option" onclick="answerChoice(this,'+o.id+')">'+escapeHtml(o.meaning)+'</button>';}).join('')+'<button class="secondary" onclick="choice()">换一题</button></div>');autoSpeak3(quiz.w.word);}
function answerChoice(btn,id){if(quiz.done)return;quiz.done=true;var ok=id===quiz.w.id;btn.classList.add(ok?'ok':'no');if(!ok){wrong(quiz.w);Array.prototype.forEach.call(document.querySelectorAll('.option'),function(b){if(b.textContent===quiz.w.meaning)b.classList.add('ok');});log('选择闯关',1);toast('答错，已加入错词本');}else{correct(quiz.w);markMastered(quiz.w);log('选择闯关',5);toast('答对，已计入已背诵');setTimeout(choice,650);}}
function rain(){setHtml('<div class="panel"><h2>🌧️ 单词雨</h2><p class="muted">点击与中文释义匹配的下落英文单词。</p><div class="row"><button onclick="startRain()">开始</button><button class="bad" onclick="clearInterval(rainTimer)">停止</button><span class="pill" id="target">点击开始</span><span class="pill" id="rainScore">得分 0</span></div><div class="space"></div><div class="gamebox" id="box"></div></div>');}
function startRain(){if(rainTimer)clearInterval(rainTimer);rainScore=0;target=pick();if(!target){donePanel();return;}document.getElementById('target').textContent='目标：'+target.meaning;var box=document.getElementById('box');box.innerHTML='';rainTimer=setInterval(function(){var w=Math.random()<.35?target:state.words[Math.floor(Math.random()*state.words.length)];var el=document.createElement('div');el.className='fall';el.textContent=w.word;el.style.left=(Math.random()*80+5)+'%';el.style.animationDuration=(3+Math.random()*2)+'s';el.onclick=function(){if(w.id===target.id){rainScore+=5;correct(w);target=pick();if(!target){clearInterval(rainTimer);donePanel();return;}document.getElementById('target').textContent='目标：'+target.meaning;}else{rainScore-=2;wrong(target);}document.getElementById('rainScore').textContent='得分 '+rainScore;el.remove();if(rainScore>=30){clearInterval(rainTimer);log('单词雨',15);toast('单词雨通关 +15');}};box.appendChild(el);setTimeout(function(){if(el.parentNode)el.remove();},5200);},750);}
function boss(){var qs=shuffle(unmasteredWords()).slice(0,10),i=0,score=0;if(!qs.length){donePanel();return;}function draw(){if(i>=qs.length){log('单元测试',score);setHtml('<div class="panel" style="text-align:center"><h2>👑 测试完成</h2><div class="metric">'+score+' 分</div><div class="stars">'+star(Math.min(5,Math.ceil(score/20)))+'</div><button onclick="go(&quot;home&quot;)">返回首页</button><button class="secondary" onclick="go(&quot;boss&quot;)">再测一次</button></div>');return;}var w=qs[i],opts=shuffle([w].concat(distractors(w,3)));setHtml('<div class="panel"><h2>👑 单元测试 '+(i+1)+'/'+qs.length+'</h2><div class="progress"><div class="bar" style="width:'+(i*10)+'%"></div></div><div class="word" style="font-size:40px">'+escapeHtml(w.word)+'</div><div class="phon">'+escapeHtml(w.phonetic||'')+'</div><div class="space"></div>'+opts.map(function(o){return '<button class="option" data-ok="'+(o.id===w.id)+'">'+escapeHtml(o.meaning)+'</button>';}).join('')+'<p class="muted">当前得分：'+score+'</p></div>');autoSpeak3(w.word);Array.prototype.forEach.call(document.querySelectorAll('.option'),function(b){b.onclick=function(){var ok=this.getAttribute('data-ok')==='true';if(ok){score+=10;correct(w);markMastered(w);}else{wrong(w);}i++;draw();};});}draw();}
function mistake(){var arr=state.words.filter(function(w){return state.mistakes.indexOf(w.id)>=0||w.wrong>0;});setHtml('<div class="panel"><h2>📘 错词本</h2>'+(arr.length?'<table><tr><th>单词</th><th>释义</th><th>错次</th><th></th></tr>'+arr.map(function(w){return '<tr><td><b>'+escapeHtml(w.word)+'</b><br><span class="muted">'+escapeHtml(w.phonetic)+'｜'+escapeHtml(w.unit)+'</span></td><td>'+escapeHtml(w.meaning)+'</td><td>'+(w.wrong||0)+'</td><td><button class="good" onclick="removeMistake('+w.id+')">移出</button></td></tr>';}).join('')+'</table>':'<p>暂无错词。</p>')+'</div>');}
function removeMistake(id){state.mistakes=state.mistakes.filter(function(x){return x!==id;});var w=state.words.find(function(x){return x.id===id;});if(w){w.status=4;if(!w.masteredAt)w.masteredAt=Date.now();}save();mistake();}
function library(){setHtml('<div class="panel"><h2>📚 词库预览</h2><p class="muted">前120条预览；完整词库已内置在本HTML文件中；已背诵词条不会再进入练习。</p><div class="row"><button onclick="exportCSV()">导出CSV词库</button><button class="bad" onclick="resetAll()">重置学习记录</button></div><div class="space"></div><div style="max-height:620px;overflow:auto"><table><tr><th>No.</th><th>Page</th><th>Word</th><th>Phonetic</th><th>Meaning</th><th>状态</th></tr>'+state.words.slice(0,120).map(function(w,i){return '<tr><td>'+(i+1)+'</td><td>'+escapeHtml(w.unit)+'</td><td><b>'+escapeHtml(w.word)+'</b></td><td>'+escapeHtml(w.phonetic)+'</td><td>'+escapeHtml(w.pos)+' '+escapeHtml(w.meaning)+'</td><td>'+((w.status||0)>=4?'已背诵':'未背诵')+'</td></tr>';}).join('')+'</table></div></div>');}
function stats(){var units=[];state.words.forEach(function(w){if(units.indexOf(w.unit)<0)units.push(w.unit);});setHtml('<div class="grid"><div class="panel c3"><div class="muted">总词条</div><div class="metric">'+state.words.length+'</div></div><div class="panel c3"><div class="muted">已背诵</div><div class="metric">'+masteredCount()+'</div></div><div class="panel c3"><div class="muted">未背诵</div><div class="metric">'+(state.words.length-masteredCount())+'</div></div><div class="panel c3"><div class="muted">掌握率</div><div class="metric">'+rate()+'%</div></div><div class="panel c12"><h3>页码分布</h3><div style="max-height:500px;overflow:auto"><table><tr><th>Page</th><th>词条数</th><th>已背诵</th></tr>'+units.map(function(u){var a=state.words.filter(function(w){return w.unit===u;});return '<tr><td>'+escapeHtml(u)+'</td><td>'+a.length+'</td><td>'+a.filter(function(w){return (w.status||0)>=4;}).length+'</td></tr>';}).join('')+'</table></div></div></div>');}
function download(name,content,type){var blob=new Blob([content],{type:type+';charset=utf-8'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(function(){URL.revokeObjectURL(a.href);},1000);}

function getProgressPayload(){var progress=state.words.filter(function(w){return (w.status||0)||(w.correct||0)||(w.wrong||0)||w.fav||(w.last||0)||(w.next||0)||(w.masteredAt||0);}).map(function(w){return {id:w.id,status:w.status||0,correct:w.correct||0,wrong:w.wrong||0,fav:!!w.fav,last:w.last||0,next:w.next||0,masteredAt:w.masteredAt||0};});return {version:13,app:'2026 Task',bankName:(typeof currentBankName==='string'?currentBankName:'考研词汇'),settings:state.settings,logs:state.logs,mistakes:state.mistakes,score:state.score,progress:progress};}
function encodeSyncPayload(obj){return 'TASK2026_'+btoa(unescape(encodeURIComponent(JSON.stringify(obj))));}
function decodeSyncPayload(code){code=String(code||'').trim();if(!code)throw new Error('同步码为空');if(code.indexOf('TASK2026_')===0){code=code.slice(9);return JSON.parse(decodeURIComponent(escape(atob(code))));}return JSON.parse(code);}
function copySyncCode(){try{var code=encodeSyncPayload(getProgressPayload());function fallback(){var ta=document.createElement('textarea');ta.value=code;ta.style.position='fixed';ta.style.left='-9999px';document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand('copy');toast('同步码已复制');}catch(e){prompt('请手动复制同步码：',code);}document.body.removeChild(ta);}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(code).then(function(){toast('同步码已复制，可粘贴到另一台电脑');},fallback);}else fallback();}catch(e){toast('生成同步码失败：'+e.message);}}
function pasteSyncCode(){var code=prompt('请粘贴同步码：');if(code==null)return;try{var payload=decodeSyncPayload(code);state=buildState(payload);save();toast('同步码恢复成功');init();}catch(e){toast('同步码无效：'+e.message);}}

function exportRecord(){download('研词星球_学习记录.json',JSON.stringify(getProgressPayload(),null,2),'application/json');}
function importRecord(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var obj=JSON.parse(r.result);state=(obj&&obj.words)?obj:buildState(obj);save();toast('记录导入成功');init();}catch(err){toast('导入失败：'+err.message);}};r.readAsText(f,'utf-8');}
function exportCSV(){var fields=['id','unit','page','word','phonetic','pos','meaning','raw','status','correct','wrong','masteredAt'];var rows=[fields.join(',')].concat(state.words.map(function(w){return fields.map(function(k){return '"'+String(w[k]||'').replace(/"/g,'""')+'"';}).join(',');}));download('研词星球_PDF源词库_稳定修正版.csv',rows.join('\n'),'text/csv');}
function resetAll(){localStorage.removeItem(progressKey());cleanupOldStorage();state=buildState({settings:{name:document.getElementById('name').value||'',goal:+document.getElementById('goal').value||30}});save();toast('已重置');render();}
function init(){document.getElementById('name').value=state.settings.name||'';document.getElementById('goal').value=state.settings.goal||30;document.getElementById('name').onchange=render;document.getElementById('goal').onchange=render;nav();render();}
init();
</script>
</body></html>
